name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  benchmark:
    name: Performance regression check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Benchmark the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=""
          fi
          if [[ -n "$BASE_SHA" ]] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" 2>/dev/null || BASE_SHA=""
          fi
          if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin main
            BASE_SHA="$(git merge-base HEAD FETCH_HEAD)"
          fi
          if [[ -z "$BASE_SHA" ]]; then
            echo "Unable to resolve a benchmark baseline revision" >&2
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/northstar-baseline" "$BASE_SHA"
          cd "$RUNNER_TEMP/northstar-baseline"
          npm ci
          npm run benchmark -- --outputJson="$RUNNER_TEMP/benchmark-baseline.json"
      - name: Benchmark this revision and compare
        run: |
          npm ci
          npm run benchmark -- --outputJson="$RUNNER_TEMP/benchmark-current.json"
          node scripts/compare-benchmarks.mjs \
            "$RUNNER_TEMP/benchmark-baseline.json" \
            "$RUNNER_TEMP/benchmark-current.json"
